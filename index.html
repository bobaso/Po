<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトタイトル</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- =========================================
     ローディング画面
========================================= -->

<div id="loading-screen" class="loading-screen">

    <!-- 古いPC風の起動画面 -->
    <div id="boot-screen" class="boot-screen">

        <div class="boot-text">
            <div class="boot-line" id="line1"></div>
            <div class="boot-line" id="line2"></div>
            <div class="boot-line" id="line3"></div>
            <div class="boot-line" id="line4"></div>
        </div>

    </div>


    <!-- ロードバー -->
    <div id="loading-bar" class="loading-bar">

        <img
            src="images/loading-bar.png"
            alt="Loading"
        >

    </div>

</div>


<!-- =========================================
     メインビジュアル
========================================= -->

<section class="main-visual">

    <img
        src="images/main-visual.png"
        alt="メインビジュアル"
    >

</section>
<!-- =========================================
     メインビジュアル
========================================= -->

<section class="main-visual">
    <img
        src="images/main-visual.png"
        alt="メインビジュアル"
    >
</section>
</body>
</html>

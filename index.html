<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトタイトル</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- =========================================
     ローディング画面
========================================= -->

<div id="loading-screen" class="loading-screen">

    <div id="boot-screen" class="boot-screen">

        <div class="boot-text">
            <div id="line1" class="boot-line"></div>
            <div id="line2" class="boot-line"></div>
            <div id="line3" class="boot-line"></div>
            <div id="line4" class="boot-line"></div>
        </div>

    </div>

    <div id="loading-bar" class="loading-bar">
        <img
            src="images/loading-bar.png"
            alt="Loading"
        >
    </div>

</div>


<!-- =========================================
     メインビジュアル
========================================= -->

<section class="main-visual">

    <img
        src="images/main-visual.png"
        alt="メインビジュアル"
    >

</section>


<script src="script.js"></script>
</body>
</html>

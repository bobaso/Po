<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトタイトル</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- =========================================
     ローディング画面
========================================= -->

<div id="loading-screen" class="loading-screen">

    <!-- 起動画面 -->
    <div id="boot-screen" class="boot-screen">

        <div class="boot-text">

            <div id="line1" class="boot-line"></div>
            <div id="line2" class="boot-line"></div>
            <div id="line3" class="boot-line"></div>
            <div id="line4" class="boot-line"></div>

        </div>

    </div>


    <!-- =====================================
         ロードバー
    ====================================== -->

    <div id="loading-bar" class="loading-bar">

        <div class="loading-bar-inner">

            <!-- 背景画像 -->
            <img
                src="images/loading-bar.png"
                alt="Loading"
                class="loading-bar-image"
            >


            <!-- Loading文字 -->
            <div
                id="loading-text"
                class="loading-text"
            >
                Loading... 0%
            </div>


            <!-- 進行ゲージ -->
            <div class="progress-container">

                <div
                    id="progress-fill"
                    class="progress-fill"
                ></div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================
     メインビジュアル
========================================= -->

<div class="visual-area">

    <!-- main-visualより下 -->
    <img
        src="images/images-object03.png"
        alt=""
        class="main-visual-under under01"
    >
<div class="visual-area">

    <!-- object03 -->
    <img
        src="images/images-object03.png"
        alt=""
        class="main-visual-under under01"
    >

    <!-- object03内のMS-DOS風ターミナル -->
    <div class="object03-terminal">

        <div
            id="terminal-text"
            class="terminal-text"
        ></div>

    </div>

    <section class="main-visual">

        <!-- 既存の内容 -->

    </section>

</div>
    <!-- main-visual -->
    <section class="main-visual">

        <img
            src="images/main-visual.png"
            alt="メインビジュアル"
            class="main-visual-image"
        >

        <img
            src="images/images-object01.png"
            alt=""
            class="main-visual-object object01"
        >

        <img
            src="images/images-button01.png"
            alt=""
            class="main-visual-button button01"
        >

        <img
            src="images/images-button02.png"
            alt=""
            class="main-visual-button button02"
        >

        <img
            src="images/images-object02.png"
            alt=""
            class="main-visual-overlay overlay01"
        >

        <img
            src="images/images-text01.png"
            alt=""
            class="main-visual-overlay text01"
        >

    </section>

</div>

<script src="script.js"></script>

</body>
</html>

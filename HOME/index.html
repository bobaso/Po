<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>サイトタイトル</title>

<link rel="stylesheet" href="home.css">

</head>


<body>

<!-- =========================================
     ローディング画面
========================================= -->

<div
    id="loading-screen"
    class="loading-screen"
>
<!-- ローディングスキップボタン -->
<button id="loadingSkipButton" class="loading-skip-button">
    SKIP
</button>
    <!-- 起動画面 -->

    <div
        id="boot-screen"
        class="boot-screen"
    >

        <div class="boot-text">

            <div
                id="line1"
                class="boot-line"
            ></div>

            <div
                id="line2"
                class="boot-line"
            ></div>

            <div
                id="line3"
                class="boot-line"
            ></div>

            <div
                id="line4"
                class="boot-line"
            ></div>

        </div>

    </div>


    <!-- =====================================
         ロードバー
    ====================================== -->

    <div
        id="loading-bar"
        class="loading-bar"
    >

        <div class="loading-bar-inner">

            <img
                src="../images/loading-bar.png"
                alt="Loading"
                class="loading-bar-image"
            >

            <div
                id="loading-text"
                class="loading-text"
            >
                Loading... 0%
            </div>

            <div class="progress-container">

                <div
                    id="progress-fill"
                    class="progress-fill"
                ></div>

            </div>

        </div>

    </div>

</div>



<!-- =========================================
     object03
========================================= -->

<div class="object03">

    <img
        src="../images/images-object03.png"
        alt=""
        class="object03-image"
    >

    <div class="object03-terminal">

        <div
            id="terminal-text"
            class="terminal-text"
        ></div>

    </div>

</div>


<!-- =========================================
     メインビジュアル
========================================= -->

<div class="visual-area">

    <section class="main-visual">


        <!-- 背景 -->

        <img
            src="../images/main-visual.png"
            alt="メインビジュアル"
            class="main-visual-image"
        >


        <!-- object01メニュー -->

        <img
            src="../images/images-object01.png"
            alt=""
            class="main-visual-object object01"
        >


<!-- button01work -->

<a href="../work/work.html">

    <img
        src="../images/images-button01.png"
        alt=""
        class="main-visual-button button01"
    >

</a>


<!-- button02profile -->

<a href="../profile/profile.html">

    <img
        src="../images/images-button02.png"
        alt=""
        class="main-visual-button button02"
    >

</a>


        <!-- object02小ウィンドウ -->

        <img
            src="../images/images-object02.png"
            alt=""
            class="main-visual-overlay overlay01"
        >


        <!-- text01 -->

        <img
            src="../images/images-text01.png"
            alt=""
            class="main-visual-overlay text01"
        >


    </section>

</div>


<!-- =========================================
     JavaScript
========================================= -->

<script src="home.js"></script>

</body>

</html>
